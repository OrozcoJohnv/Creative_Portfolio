<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orozco Creatives</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1. LOCK VIEWPORT HEIGHT & BAN GLOBAL SCROLLING */
        html,
        body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0b0d40;
            color: #141764;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #141764;
            color: white;
            flex-shrink: 0;
        }

        .top-header {
            height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #23299c;
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #7452e8;
            object-fit: cover;
        }

        .brand {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 23px 45px;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover,
        nav a.active {
            background-color: #23299c;
        }

        /* 2. FORCE MAIN CONTAINER TO STAY WITHIN THE REMAINDER OF WINDOW */
        main {
            flex: 1;
            padding: 15px 3%;
            /* Reduced top/bottom padding */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 3. CONVERT WHITE BOX TO FLEX TO MANAGE INTERIOR SPACE */
        .portfolio-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 25px 40px;
            /* Thinner padding to leave vertical space */
            text-align: center;
            width: 75%;
            max-width: 75%;
            height: 100%;
            /* Spans exactly inside main bounds */

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .portfolio-container h1 {
            font-size: 30px;
            /* Slightly scaled down text */
            color: #141764;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 15px;
            color: #5548a1;
            margin-bottom: 20px;
            /* Reduced bottom margin */
        }

        /* 4. REDUCE GRID GAPS */
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px 20px;
            /* Shrunk vertical row gaps from 40px to 15px */
            justify-items: center;
            align-content: center;
            width: 100%;
            flex: 1;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* 5. SLIGHTLY REDUCE IMAGE BOUNDS TO PREVENT CLIPPING */
        .profile-card img {
            width: 105px;
            /* Shrunk from 120px to 105px so 3 rows safely fit 100vh */
            height: 105px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #23299c;
            margin-bottom: 8px;
            background-color: #ccc;
        }

        .profile-card span {
            font-size: 12px;
            font-weight: bold;
            color: #141764;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            background-color: #141764;
            color: white;
            text-align: center;
            padding: 18px;
            /* Slightly slimmer footer */
            font-size: 14px;
            flex-shrink: 0;
        }

        @media (max-width: 700px) {

            html,
            body {
                overflow: auto;
                /* Re-allows scrolling ONLY on mobile screens */
                height: auto;
            }

            .brand {
                font-size: 20px;
            }

            nav a {
                padding: 20px 12px;
                font-size: 13px;
            }

            .portfolio-container {
                padding: 30px 15px;
                width: 95%;
                max-width: 95%;
            }

            .profiles-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px 15px;
            }

            .profile-card img {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="top-header">
            <img src="logo.png" class="logo" alt="Logo">
            <div class="brand">OROZCO CREATIVES</div>
        </div>

        <nav>
            <a href="index2.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="gallery.html" class="active">GALLERY</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <main>
        <section class="portfolio-container">
            <h1>Creative Portfolio</h1>
            <p class="subtitle">A curated look at our latest collections and artistic ventures.</p>

            <div class="profiles-grid">
                <div class="profile-card"><img src="profile.jpg" alt="Project 01"><span>Project 01</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 02"><span>Project 02</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 03"><span>Project 03</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 04"><span>Project 04</span></div>

                <div class="profile-card"><img src="profile.jpg" alt="Project 05"><span>Project 05</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 06"><span>Project 06</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 07"><span>Project 07</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 08"><span>Project 08</span></div>

                <div class="profile-card"><img src="profile.jpg" alt="Project 09"><span>Project 09</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 10"><span>Project 10</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 11"><span>Project 11</span></div>
                <div class="profile-card"><img src="profile.jpg" alt="Project 12"><span>Project 12</span></div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 Orozco Creatives
    </footer>

</body>

</html>
